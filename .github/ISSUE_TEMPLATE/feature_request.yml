name: Özellik isteği
description: Yeni bir denetim kuralı, MCP aracı veya içe/dışa aktarma biçimi önerin.
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Hangi sorun çözülecek?
      description: Kullanıcı hikâyesi olarak yazın ("satıcı olarak ... istiyorum, çünkü ...").
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Öneri
      description: Yeni kural/araç adı, hangi veriyi okur, hangi bulguyu üretir.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Kapsam
      options:
        - Yeni denetim kuralı
        - Yeni MCP aracı
        - İçe/dışa aktarma (CSV/JSON)
        - Dokümantasyon
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: İlkeler
      options:
        - label: Öneri deterministik kalıyor (LLM bulgu üretmiyor) ve salt-okunur
          required: true
