name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Kapılar (lint · format · typecheck · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # sürüm package.json > packageManager alanından okunur
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Bağımlılıkları kur (kilit dosyasına sadık)
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Biçim denetimi
        run: pnpm run format:check
      - name: Tip denetimi
        run: pnpm run typecheck
      - name: Derleme (MCP sunucusunun çalıştırılabilir girdisi)
        run: pnpm run build
      - name: Testler
        run: pnpm run test
      - name: Eval (kural bazlı precision/recall eşiği + rapor güncel mi)
        run: pnpm run eval:check
