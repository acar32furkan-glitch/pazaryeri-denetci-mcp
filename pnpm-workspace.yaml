# pnpm workspaces — apps/web Faz 4'te buraya eklenir (docs/DECISIONS.md, Sapmalar).
packages:
  - packages/*
  - apps/*

# pnpm 11+ derleme betiklerini varsayılan olarak bloklar; `allowBuilds` haritası ister
# (eski `onlyBuiltDependencies` pnpm 11'den beri okunmuyor).
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  # zod 4.6.7 yeni yayınlandı; pnpm'un "minimum yayın yaşı" karantinasına takılmaması için
  # bilinçli olarak listeye alındı (MCP SDK v2'nin zod v4 gereksinimi).
  - zod@4.6.7
